apiVersion: v1
kind: ConfigMap
metadata:
  name: ktpl-parameter
  namespace: argocd
  annotations:
    ktpl.io/local: "true"
  labels:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: ktpl
    app.kubernetes.io/version: '{{ ref "argocd/configmap/ktpl-parameter" "data.version" }}'
data:
  version: v3.5.3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    <<: '{{ ref "argocd/configmap/ktpl-parameter" "metadata.labels" }}'
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/component: server
    mylabel: "2"
data:
  policy.csv: ""
