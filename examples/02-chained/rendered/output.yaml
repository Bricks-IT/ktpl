apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shop
  annotations:
    ktpl.io/rendered: '{"data.ENV":1,"data.BASE_URL":1,"data.API_URL":1}'
data:
  # iteration 1: only depends on static objects
  ENV: prod
  BASE_URL: https://shop.example.com
  API_URL: http://api.shop.svc:8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: shop
  annotations:
    ktpl.io/rendered: '{"spec.rules[0].host":2,"spec.rules[0].http.paths[0].backend.service.name":1,"spec.rules[0].http.paths[0].backend.service.port.name":1}'
spec:
  rules:
    # iteration 2: BASE_URL is only resolved at iteration 1
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # iteration 1
                name: api
                port:
                  name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels:
    app: api
    env: prod # iteration 1
  annotations:
    ktpl.io/rendered: '{"metadata.labels.env":1,"spec.replicas":1,"spec.template.metadata.labels":2,"spec.template.spec.containers[0].image":1,"spec.template.spec.containers[0].ports[0].containerPort":1,"spec.template.spec.containers[0].env[0].value":3}'
spec:
  replicas: 3 # iteration 1, sprig cast "3" -> 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      # iteration 2: copies the metadata.labels map (resolved at iteration 1), native type kept
      labels:
        app: api
        env: prod
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/api:1.4.2
          ports:
            - name: http
              containerPort: 8080 # iteration 1, native int
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PUBLIC_HOST
              # iteration 3: depends on the ingress host (iteration 2)
              value: shop.example.com
