apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: ktpl
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: '{{ ref "argocd/configmap/ktpl-parameter" "data.version" }}'
data:
  applicationsetcontroller.enable.leader.election: "false"
  applicationsetcontroller.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  applicationsetcontroller.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  commitserver.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  commitserver.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  controller.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  controller.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  dexserver.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  dexserver.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  notificationscontroller.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  notificationscontroller.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  redis.server: argocd-redis:6379
  repo.server: argocd-repo-server:8081
  reposerver.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  reposerver.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  server.dex.server: https://argocd-dex-server:5556
  server.dex.server.strict.tls: "false"
  server.log.format: '{{ ref "argocd/configmap/ktpl-parameter" "data.logFormat" }}'
  server.log.level: '{{ ref "argocd/configmap/ktpl-parameter" "data.logLevel" }}'
  server.repo.server.strict.tls: "false"
