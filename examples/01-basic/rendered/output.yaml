apiVersion: v1
kind: ConfigMap
metadata:
  name: db
  namespace: demo
data:
  host: postgres.demo.svc.cluster.local
  port: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  annotations:
    ktpl.io/rendered: '{"spec.template.spec.containers[0].env[0].value":1}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          env:
            - name: DATABASE_URL
              value: postgres://postgres.demo.svc.cluster.local:5432/app
