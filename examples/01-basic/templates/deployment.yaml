apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          env:
            - name: DATABASE_URL
              value: 'postgres://{{ ref "demo/configmap/db" "data.host" }}:{{ ref "demo/configmap/db" "data.port" }}/app'
