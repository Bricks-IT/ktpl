apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-api-v1
  namespace: default
  labels:
    app.kubernetes.io/name: api
data:
  env: production
---
apiVersion: v1
kind: Service
metadata:
  name: prod-web-v1
  namespace: default
  annotations:
    ktpl.io/rendered: '{"spec.selector.app":1}'
spec:
  selector:
    app: api
