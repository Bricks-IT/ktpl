# ktpl.io/ignore: the whole object is left untouched (it can still be referenced).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: shop
  annotations:
    ktpl.io/ignore: "true"
spec:
  groups:
    - name: api
      rules:
        - alert: ApiDown
          expr: up{job="api"} == 0
          annotations:
            summary: 'Instance {{ $labels.instance }} is down'
